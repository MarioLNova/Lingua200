name: Apply Lingua200 true black

on:
  push:
    paths:
      - '.github/workflows/apply-dark-sky.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply true black styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_marker = '/* LINGUA200_DARK_SKY */'
          new_marker = '/* LINGUA200_TRUE_BLACK */'
          css = '''
          /* LINGUA200_TRUE_BLACK */
          :root{
            --bg:#000000;
            --panel:#070707;
            --panel2:#0d0d0d;
            --text:#f7f7f7;
            --muted:#9b9b9b;
            --line:#ffffff18;
          }
          html,body{background:#000!important;color:#f7f7f7!important;}
          body{background-image:none!important;}
          body:before,body:after{display:none!important;content:none!important;}
          .lock{background:#000!important;}
          .lockbox,.hero,.card,.progressbox,.stat,.field{
            background:#080808!important;
            border-color:#ffffff1c!important;
            box-shadow:none!important;
            backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
          }
          .field select,.passrow input{
            background:#000!important;
            color:#fff!important;
            border-color:#ffffff20!important;
          }
          .pill,.answer,.lvl,.swap{
            background:#0a0a0a!important;
            color:#f4f4f4!important;
            border-color:#ffffff1c!important;
          }
          .hero h1{
            background:none!important;
            color:#fff!important;
            -webkit-text-fill-color:#fff!important;
          }
          .logo,.start,.unlock,.next{
            background:#171717!important;
            color:#fff!important;
            border:1px solid #ffffff24!important;
            box-shadow:none!important;
          }
          .track{background:#161616!important;}
          .bar{background:#e8e8e8!important;}
          .lvl.unlocked{background:#111!important;border-color:#ffffff30!important;}
          .lvl.current{background:#1b1b1b!important;outline:2px solid #fff!important;}
          .lvl.done{background:#123d27!important;border-color:#25d97875!important;color:#91ffc0!important;}
          .answer.correct{background:#123d27!important;border-color:#25d978!important;color:#a9ffd0!important;}
          .answer.wrong{background:#43141a!important;border-color:#ff5468!important;color:#ffc3ca!important;}
          '''
          if old_marker in s:
              before, _, rest = s.partition(old_marker)
              end = rest.find('</style>')
              if end != -1:
                  s = before + css + '\n' + rest[end:]
          elif new_marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit black mode
        run: |
          git config user.name "MarioLNova"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Lingua200 true black mode"
          git push
