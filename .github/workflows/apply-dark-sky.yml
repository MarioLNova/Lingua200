name: Apply Lingua200 luxury black gold

on:
  push:
    paths:
      - '.github/workflows/apply-dark-sky.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply luxury black gold styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_marker = '/* LINGUA200_BLACK_GOLD */'
          new_marker = '/* LINGUA200_LUXURY_BLACK_GOLD */'
          css = '''
          /* LINGUA200_LUXURY_BLACK_GOLD */
          :root{
            --bg:#000000;
            --panel:#080706;
            --panel2:#11100d;
            --text:#fbf8ef;
            --muted:#b9ae91;
            --line:#d8b75f38;
            --gold:#d8b75f;
            --gold2:#f6df99;
            --gold3:#9a7426;
          }
          html,body{background:#000!important;color:var(--text)!important;}
          body{
            background:
              radial-gradient(circle at 50% -10%,rgba(246,223,153,.20),transparent 28%),
              radial-gradient(circle at 10% 18%,rgba(216,183,95,.075),transparent 24%),
              radial-gradient(circle at 90% 24%,rgba(216,183,95,.06),transparent 22%),
              linear-gradient(180deg,#020201 0%,#000 34%,#030302 100%)!important;
            position:relative;
            overflow-x:hidden;
          }
          body:before{
            content:""!important;
            display:block!important;
            position:fixed;
            inset:0;
            z-index:-2;
            pointer-events:none;
            opacity:.28;
            background-image:
              radial-gradient(circle at 7% 13%,rgba(255,235,177,.95) 0 1px,transparent 1.5px),
              radial-gradient(circle at 18% 36%,rgba(216,183,95,.68) 0 1px,transparent 1.5px),
              radial-gradient(circle at 31% 18%,rgba(255,238,190,.82) 0 1.1px,transparent 1.6px),
              radial-gradient(circle at 47% 43%,rgba(216,183,95,.58) 0 1px,transparent 1.5px),
              radial-gradient(circle at 60% 16%,rgba(255,238,190,.84) 0 1px,transparent 1.5px),
              radial-gradient(circle at 74% 37%,rgba(216,183,95,.66) 0 1px,transparent 1.5px),
              radial-gradient(circle at 88% 17%,rgba(255,235,177,.92) 0 1px,transparent 1.5px),
              radial-gradient(circle at 96% 57%,rgba(216,183,95,.56) 0 1px,transparent 1.5px);
            background-size:500px 340px;
          }
          body:after{
            content:""!important;
            display:block!important;
            position:fixed;
            width:62vw;
            height:30vw;
            left:19vw;
            top:-18vw;
            z-index:-1;
            pointer-events:none;
            border-radius:50%;
            background:rgba(216,183,95,.12);
            filter:blur(88px);
          }
          .lock{background:#000!important;}
          .lockbox,.hero,.card,.progressbox,.stat,.field{
            background:
              linear-gradient(145deg,rgba(16,15,12,.97),rgba(5,5,4,.98)) padding-box,
              linear-gradient(135deg,rgba(246,223,153,.38),rgba(216,183,95,.08),rgba(246,223,153,.22)) border-box!important;
            border:1px solid transparent!important;
            box-shadow:
              0 20px 60px rgba(0,0,0,.48),
              0 0 30px rgba(216,183,95,.045),
              inset 0 1px 0 rgba(255,238,190,.055)!important;
            backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
          }
          .hero{position:relative;overflow:hidden;}
          .hero:after{
            content:"";
            position:absolute;
            width:220px;
            height:220px;
            right:-90px;
            top:-110px;
            border-radius:50%;
            pointer-events:none;
            background:radial-gradient(circle,rgba(246,223,153,.12),transparent 68%);
          }
          .field select,.passrow input{
            background:linear-gradient(180deg,#050504,#000)!important;
            color:#fff!important;
            border:1px solid rgba(216,183,95,.24)!important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.03)!important;
          }
          .pill,.answer,.lvl,.swap{
            background:linear-gradient(180deg,#0d0c0a,#070706)!important;
            color:#f9f5e9!important;
            border:1px solid rgba(216,183,95,.18)!important;
            box-shadow:inset 0 1px 0 rgba(255,238,190,.025)!important;
          }
          .brand{letter-spacing:.01em;}
          .hero h1{
            background:linear-gradient(90deg,#fff 0%,#f9e9b8 30%,#d8b75f 68%,#fff0bc 100%)!important;
            -webkit-background-clip:text!important;
            background-clip:text!important;
            color:transparent!important;
            -webkit-text-fill-color:transparent!important;
            text-shadow:0 0 34px rgba(216,183,95,.08);
          }
          .logo,.start,.unlock,.next{
            background:linear-gradient(135deg,#7b5712 0%,#c9a64a 35%,#f6df99 68%,#a67d24 100%)!important;
            color:#080704!important;
            border:1px solid rgba(255,238,190,.50)!important;
            box-shadow:
              0 10px 28px rgba(216,183,95,.16),
              inset 0 1px 0 rgba(255,255,255,.35),
              inset 0 -1px 0 rgba(80,52,0,.22)!important;
            transition:transform .18s ease,filter .18s ease,box-shadow .18s ease!important;
          }
          .start:hover,.unlock:hover,.next:hover,.logo:hover{
            filter:brightness(1.07);
            transform:translateY(-1px);
            box-shadow:0 14px 34px rgba(216,183,95,.22),inset 0 1px 0 rgba(255,255,255,.4)!important;
          }
          .track{background:#151107!important;border:1px solid rgba(216,183,95,.08)!important;}
          .bar{background:linear-gradient(90deg,#6e4e10,#cda943,#f6df99,#bd9132)!important;box-shadow:0 0 16px rgba(216,183,95,.18)!important;}
          .lvl{transition:transform .16s ease,border-color .16s ease,background .16s ease!important;}
          .lvl.unlocked{background:#11100d!important;border-color:rgba(216,183,95,.30)!important;}
          .lvl.unlocked:hover{transform:translateY(-2px);border-color:rgba(246,223,153,.55)!important;background:#17140c!important;}
          .lvl.current{background:linear-gradient(145deg,#211906,#0d0a03)!important;outline:2px solid #d8b75f!important;box-shadow:0 0 18px rgba(216,183,95,.16)!important;}
          .lvl.done{background:#123d27!important;border-color:#25d97875!important;color:#91ffc0!important;}
          .answer{transition:transform .16s ease,border-color .16s ease,background .16s ease!important;}
          .answer:hover:not(:disabled){transform:translateY(-2px)!important;border-color:rgba(246,223,153,.42)!important;background:#141108!important;}
          .answer.correct{background:#123d27!important;border-color:#25d978!important;color:#a9ffd0!important;}
          .answer.wrong{background:#43141a!important;border-color:#ff5468!important;color:#ffc3ca!important;}
          .reset{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important;}
          @media (prefers-reduced-motion:reduce){
            .start,.unlock,.next,.logo,.lvl,.answer{transition:none!important;}
            .start:hover,.unlock:hover,.next:hover,.logo:hover,.lvl.unlocked:hover,.answer:hover:not(:disabled){transform:none!important;}
          }
          '''
          if old_marker in s:
              before, _, rest = s.partition(old_marker)
              end = rest.find('</style>')
              if end != -1:
                  s = before + css + '\n' + rest[end:]
          elif new_marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit luxury mode
        run: |
          git config user.name "MarioLNova"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade Lingua200 luxury black gold style"
          git push
