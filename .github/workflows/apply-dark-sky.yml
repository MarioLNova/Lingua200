name: Apply Lingua200 human curated lessons

on:
  push:
    paths:
      - '.github/workflows/apply-dark-sky.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove automatic translation and use human curated lessons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (
              "LANGS.forEach(([c,f,n])=>{from.add(new Option(`${f} ${n}`,c));to.add(new Option(`${f} ${n}`,c));});",
              "const HUMAN_LANGS=['en','es','ro'];LANGS.filter(([c])=>HUMAN_LANGS.includes(c)).forEach(([c,f,n])=>{from.add(new Option(`${f} ${n}`,c));to.add(new Option(`${f} ${n}`,c));});"
            ),
            (
              "from.value=LANGS.some(x=>x[0]===S.from)?S.from:'en';to.value=LANGS.some(x=>x[0]===S.to)?S.to:'es';",
              "from.value=HUMAN_LANGS.includes(S.from)?S.from:'en';to.value=HUMAN_LANGS.includes(S.to)?S.to:'es';"
            ),
            (
              "async function phrase(text,lang){if(lang==='en')return text;if(BUILTIN[lang]&&BUILTIN[lang][text])return BUILTIN[lang][text];let key='lingua200:'+lang+':'+text,c=localStorage.getItem(key);if(c)return c;let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|'+encodeURIComponent(lang));if(!r.ok)throw Error();let j=await r.json(),out=j?.responseData?.translatedText;if(!out)throw Error();localStorage.setItem(key,out);return out}",
              "async function phrase(text,lang){if(lang==='en')return text;if(BUILTIN[lang]&&BUILTIN[lang][text])return BUILTIN[lang][text];throw Error('Human-written phrase unavailable')}"
            ),
            (
              "$('hint').textContent='Loading translations'",
              "$('hint').textContent='Loading human-written lesson'"
            ),
            (
              "$('question').textContent='Could not load this language pair';$('hint').textContent='Try English ⇄ Spanish / Romanian, or choose another pair while online.';$('qCount').textContent='Translation unavailable'",
              "$('question').textContent='Human-written phrase unavailable';$('hint').textContent='Lingua200 currently uses human-curated English, Spanish and Romanian lessons only.';$('qCount').textContent='Lesson unavailable'"
            ),
            (
              "<div class=\"eyebrow\">Choose the correct translation</div>",
              "<div class=\"eyebrow\">Choose the natural phrase</div>"
            ),
            (
              "$('hint').textContent='Choose the correct translation.'",
              "$('hint').textContent='Choose the natural matching phrase.'"
            ),
            (
              "Built-in lessons are strongest for English ⇄ Spanish and English ⇄ Romanian. Other language pairs use an online translation service when available and are cached on your device.",
              "Human-curated lessons only: English ⇄ Spanish ⇄ Romanian. No automatic translator or online translation API."
            ),
            (
              "Lingua200 — learn languages through 200 levels of quick translation challenges.",
              "Lingua200 — learn languages through 200 levels of human-written phrase challenges."
            )
          ]

          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          if 'api.mymemory.translated.net' in s:
              raise SystemExit('Automatic translation API still present; refusing partial update')

          if "const HUMAN_LANGS=['en','es','ro'];" not in s:
              raise SystemExit('Human language filter was not applied')

          if changed:
              p.write_text(s)
          PY
      - name: Commit human curated lesson mode
        run: |
          git config user.name "MarioLNova"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use human curated Lingua200 lessons only"
          git push
